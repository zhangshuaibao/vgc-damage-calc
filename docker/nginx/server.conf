server {
    # 侦听80端口
    listen       80;
    charset UTF-8;

    location / {
        return 301 /calc/;
    }

    location /images {
        proxy_pass https://pokestats.top;
        proxy_set_header Host pokestats.top;
        proxy_ssl_server_name on;
    }

    location /api {
        proxy_pass https://pokestats.top;
        proxy_set_header Host pokestats.top;
        proxy_ssl_server_name on;
    }

    location /calc/ {
        alias  /front_end/;
        index  index.html;
        try_files $uri $uri/ /calc/index.html;

        # 为wasm和mjs文件添加正确的MIME类型
        location ~* \.(wasm)$ {
            types {
                application/wasm wasm;
            }
            add_header Cache-Control "public, max-age=3600";
        }

        location ~* \.(mjs)$ {
            types {
                application/javascript mjs;
            }
            add_header Cache-Control "public, max-age=3600";
        }

        #图片缓存365天
        location ~.*\.(jpg|png|jpeg|ico)$ {
            expires 365d;
        }

        #js css缓存30天
        location ~.*\.(js|css|mjs)$ {
            expires 30d;
        }
    }
}